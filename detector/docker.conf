IMAGE_REPO=zauberzeug/yolov5-detector
CONTAINER_NAME="${CONTAINER_NAME:-${DETECTOR_NAME:-yolov5_detector}}"   # DETECTOR_NAME is the deprecated spelling
HOST_PORT="${HOST_PORT:-8004}"
GPU=TRUE
ENV_FILE=TRUE

# Jetson and cloud need different base images, and the tag records which one was used.
select_image() {
    EXTRA_BUILD_ARGS+=" --build-arg NODE_LIB_VERSION=$NODE_LIB_VERSION"
    if [ -f /etc/nv_tegra_release ]; then
        # version discovery borrowed from
        # https://github.com/dusty-nv/jetson-containers/blob/master/scripts/l4t_version.sh
        # sed, not `grep -Po`: -P is a GNU extension (see node-docker.sh)
        local line release revision
        line=$(head -n 1 /etc/nv_tegra_release)
        release=$(echo "$line" | cut -f 2 -d ' ' | sed -n 's/^R//p')
        revision=$(echo "$line" | cut -f 2 -d ',' | sed -n 's/^ *REVISION: //p')
        if [ "$release" != "36" ]; then
            echo "Unsupported L4T version: $release.$revision"; exit 1
        fi
        # L4T R36.x containers can run on other versions of L4T R36.x (JetPack 6.0+)
        echo "Using L4T version 36.4.0 (dusty image for exact version $release.$revision)"
        EXTRA_BUILD_ARGS+=" --build-arg BASE_IMAGE=dustynv/l4t-ml:r36.4.0 --build-arg INSTALL_OPENCV=false"
        IMAGE_TAG_SUFFIX=-jetson
        LINKLL_SITE_PACKAGES=/usr/local/lib/python3.8/dist-packages
    else
        EXTRA_BUILD_ARGS+=" --build-arg BASE_IMAGE=nvcr.io/nvidia/tensorrt:26.05-py3 --build-arg INSTALL_OPENCV=true"
        IMAGE_TAG_SUFFIX=-cloud
        LINKLL_SITE_PACKAGES=/uv_env/.venv/lib/python3.12/site-packages
    fi
}

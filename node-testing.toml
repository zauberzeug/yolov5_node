# Describes this node to the end-to-end round trip: images, builds, model formats and the data it trains on.
name = "yolov5"
architecture = "yolov5"
model_variant = "n"
model_format = "yolov5_pytorch"
needs_gpu = true
finish_timeout = 3600

[trainer]
image = "zauberzeug/yolov5-trainer:{version}"
build = { dockerfile = "trainer/Dockerfile", context = "trainer" }

# `-cloud`: the release's build for everything but Jetson.
[[detectors]]
name = "trt"
image = "zauberzeug/yolov5-detector:{version}-cloud"
model_format = "yolov5_wts"
build = { dockerfile = "detector/Dockerfile", context = "detector" }
model_timeout = 1800
# No round_trip_environment: the engine is built at the shipped optimization level, as customers run it.

[[detectors]]
name = "cpu"
image = "zauberzeug/yolov5-detector:{version}-cloud-cpu"
model_format = "yolov5_pytorch"
build = "detector_cpu"

# The trainer publishes no model before 100 warmup steps, and on a small set an epoch is one step:
# 150 epochs is the minimum. No --quick for the same reason.
[hyperparameters]
epochs = 150
resolution = 320

# Real photos of faces and hands, at mixed sizes and aspect ratios.
[[datasets]]
name = "testing/facedetection"
fscore_floor = 0.5
max_f1_drop = 0.03

[datasets.hyperparameters]
resolution = 640

# Red and blue triangles: an RGB/BGR swap flips every box. One of the 15 test boxes is worth ~0.07 F1.
[[datasets]]
name = "testing/small_set"
fscore_floor = 0.9
max_f1_drop = 0.1

name: docker-deploy

on:
  release:
    types: [published]

env:
  VERSION: ${{ github.event.release.tag_name }}
  PRERELEASE: ${{ github.event.release.prerelease }}

jobs:
  multi-arch:
    runs-on: [self-hosted, cpu, X64]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - context: trainer/
            dockerfile: trainer/Dockerfile
            image: zauberzeug/yolov5-trainer
            tag_suffix: ""
            build_args: ""
          - context: detector/
            dockerfile: detector/Dockerfile
            image: zauberzeug/yolov5-detector
            tag_suffix: "-cloud"
            build_args: "--build-arg BASE_IMAGE=nvcr.io/nvidia/tensorrt:26.05-py3 --build-arg INSTALL_OPENCV=true"
          - context: .
            dockerfile: detector_cpu/Dockerfile
            image: zauberzeug/yolov5-detector
            tag_suffix: "-cloud-cpu"
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build and push
        run: |
          tags=(-t ${{ matrix.image }}:${VERSION#v}${{ matrix.tag_suffix }})
          if [ "$PRERELEASE" != true ]; then
            tags+=(-t ${{ matrix.image }}:latest${{ matrix.tag_suffix }})
          fi
          docker buildx build ${{ matrix.context }} \
            --builder node-release \
            --platform linux/amd64,linux/arm64 \
            -f ${{ matrix.dockerfile }} \
            ${{ matrix.build_args }} \
            --build-arg VERSION=${VERSION#v} \
            "${tags[@]}" \
            --push

  detector-jetson:
    runs-on: [self-hosted, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build and push
        run: |
          docker build detector/ \
            -f detector/Dockerfile \
            --build-arg BASE_IMAGE=dustynv/l4t-ml:r36.4.0 \
            --build-arg INSTALL_OPENCV=false \
            --build-arg VERSION=${VERSION#v} \
            -t zauberzeug/yolov5-detector:${VERSION#v}-jetson
          docker push zauberzeug/yolov5-detector:${VERSION#v}-jetson
          if [ "$PRERELEASE" != true ]; then
            docker tag zauberzeug/yolov5-detector:${VERSION#v}-jetson zauberzeug/yolov5-detector:latest-jetson
            docker push zauberzeug/yolov5-detector:latest-jetson
          fi

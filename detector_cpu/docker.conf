IMAGE_REPO=zauberzeug/yolov5-detector
IMAGE_TAG_SUFFIX=-cloud-cpu
TEST_LATEST_TAG=latest-cpu
CONTAINER_NAME="${CONTAINER_NAME:-${DETECTOR_NAME:-yolov5_detector_cpu}}"   # DETECTOR_NAME is the deprecated spelling
DATA_VOLUME="$HOME/node_data/$CONTAINER_NAME"
HOST_PORT="${HOST_PORT:-8004}"
BUILD_CONTEXT=..
DOCKERFILE=Dockerfile
# The Dockerfile builds a venv at /uv_env/.venv on python:3.12-bookworm, so that is where the
# installed library sits. The previous value (/usr/local/lib/python3.10/dist-packages) matched no
# directory on sys.path at all, which made LINKLL=TRUE a silent no-op.
LINKLL_SITE_PACKAGES=/uv_env/.venv/lib/python3.12/site-packages
ENV_FILE=TRUE

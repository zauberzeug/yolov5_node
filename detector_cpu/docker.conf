IMAGE_REPO=zauberzeug/yolov5-detector
IMAGE_TAG_SUFFIX=-cloud-cpu
TEST_LATEST_TAG=latest-cpu
CONTAINER_NAME="${DETECTOR_NAME:-yolov5_detector_cpu}"
DATA_VOLUME="$HOME/node_data/$CONTAINER_NAME"
HOST_PORT=8004
BUILD_CONTEXT=..
DOCKERFILE=Dockerfile
LINKLL_SITE_PACKAGES=/usr/local/lib/python3.10/dist-packages
FORWARD_ENV="HOST=LOOP_HOST ORGANIZATION=LOOP_ORGANIZATION PROJECT=LOOP_PROJECT USE_BACKDOOR_CONTROLS"

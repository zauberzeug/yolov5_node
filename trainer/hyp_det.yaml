# The yolov5 hyperparameters come from upstream app_code/yolov5/data/hyps/hyp.scratch-{low,med,high}.yaml,
# chosen by the model size (see yolov5_format.create_hyperparameter_file). This file adds the node's own
# parameters and overrides the upstream flips; a training's hyperparameters override both.

flipud: 0.0 # image flip up-down (probability), off unless the training sets it
fliplr: 0.0 # image flip left-right (probability), off unless the training sets it

#own parameters
epochs: 2000
patience: 300 # epochs without improvement before the training stops
detect_nms_conf_thres: 0.2 # minimum confidence, applied to compute validation scores as well as in detection step
detect_nms_iou_thres: 0.45 # maximum iou between detections of the same category, applied to compute validation scores as well as in detection step

#extra point parameters (not directly used by yolov5 but by the trainer logic)
reset_points: false
point_sizes_by_id: "" # e.g "1111-2222-3333-4444:0.03,5555-6666-7777-8888:0.05"
flip_label_pairs: "" # e.g "1111-2222-3333-4444:5555-6666-7777-8888"
